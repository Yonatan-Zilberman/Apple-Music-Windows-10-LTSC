<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Now Playing</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1c1c1e;
        --bg-elevated: #2c2c2e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #fc3c44;
        --btn: rgba(255, 255, 255, 0.08);
        --btn-hover: rgba(255, 255, 255, 0.16);
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      .shell {
        margin: 8px;
        height: calc(100% - 16px);
        border-radius: 18px;
        background: rgba(28, 28, 30, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow:
          0 12px 40px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        padding: 14px 14px 12px;
        -webkit-app-region: drag;
        transition: background 200ms ease;
      }

      .top {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 64px;
      }

      .art-wrap {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
        border-radius: 10px;
      }

      .art {
        width: 64px;
        height: 64px;
        border-radius: 10px;
        object-fit: cover;
        background: var(--bg-elevated);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        display: block;
        transition: opacity 200ms ease, transform 200ms ease;
      }

      .art.placeholder {
        display: grid;
        place-items: center;
        color: var(--muted);
        position: absolute;
        inset: 0;
      }

      .art.placeholder svg {
        width: 28px;
        height: 28px;
        opacity: 0.55;
      }

      /* Exactly one of art image / placeholder */
      .art-wrap.has-art img.art {
        display: block;
        opacity: 1;
      }
      .art-wrap.has-art .placeholder {
        display: none !important;
      }
      .art-wrap:not(.has-art) img.art {
        display: none !important;
        opacity: 0;
      }
      .art-wrap:not(.has-art) .placeholder {
        display: grid;
      }

      .meta {
        min-width: 0;
        flex: 1;
      }

      .title {
        color: var(--text);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 150ms ease;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 150ms ease;
      }

      .open {
        -webkit-app-region: no-drag;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 0 0;
        transition: opacity 120ms ease, transform 120ms ease;
      }

      .open:hover {
        opacity: 0.85;
      }

      .open:active {
        transform: scale(0.96);
      }

      .controls {
        margin-top: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        -webkit-app-region: no-drag;
      }

      .ctrl {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        background: var(--btn);
        color: var(--text);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 120ms ease, transform 120ms ease, box-shadow 120ms ease;
      }

      .ctrl:hover {
        background: var(--btn-hover);
      }

      .ctrl:active {
        transform: scale(0.90);
      }

      .ctrl.primary {
        width: 44px;
        height: 44px;
        background: #fff;
        color: #111;
        box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
      }

      .ctrl.primary:hover {
        background: #f2f2f2;
        box-shadow: 0 6px 18px rgba(255, 255, 255, 0.3);
      }

      .ctrl.primary:active {
        transform: scale(0.90);
      }

      .ctrl svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .ctrl.primary svg {
        width: 18px;
        height: 18px;
      }

      /* Toggle play / pause — never both */
      #playPause .icon-play {
        display: block;
      }
      #playPause .icon-pause {
        display: none;
      }
      #playPause.is-playing .icon-play {
        display: none;
      }
      #playPause.is-playing .icon-pause {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="top">
        <div id="artWrap" class="art-wrap">
          <img id="art" class="art" alt="" />
          <div id="artPlaceholder" class="art placeholder" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M9 18V6l11-2v12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="7" cy="18" r="2.4" fill="currentColor" />
              <circle cx="18" cy="16" r="2.4" fill="currentColor" />
            </svg>
          </div>
        </div>
        <div class="meta">
          <div id="title" class="title">Nothing playing</div>
          <div id="subtitle" class="subtitle">Apple Music</div>
          <button id="open" class="open" type="button">Open Apple Music</button>
        </div>
      </div>
      <div class="controls">
        <button id="prev" class="ctrl" type="button" title="Previous" aria-label="Previous">
          <svg viewBox="0 0 24 24">
            <path d="M6 6h2.2v12H6V6zm3.3 6 9.7 6.2V5.8L9.3 12z" />
          </svg>
        </button>
        <button id="playPause" class="ctrl primary" type="button" title="Play/Pause" aria-label="Play/Pause">
          <svg class="icon-play" viewBox="0 0 24 24">
            <path d="M8 5.5v13l11-6.5L8 5.5z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24">
            <path d="M7 5h3.5v14H7V5zm6.5 0H17v14h-3.5V5z" />
          </svg>
        </button>
        <button id="next" class="ctrl" type="button" title="Next" aria-label="Next">
          <svg viewBox="0 0 24 24">
            <path d="M15.8 6H18v12h-2.2V6zM5 18.2V5.8L14.7 12 5 18.2z" />
          </svg>
        </button>
      </div>
    </div>
    <script>
      const titleEl = document.getElementById("title");
      const subtitleEl = document.getElementById("subtitle");
      const artEl = document.getElementById("art");
      const artWrap = document.getElementById("artWrap");
      const playPauseBtn = document.getElementById("playPause");

      function applyState(state) {
        const title = (state && state.title) || "Nothing playing";
        const artist = (state && state.artist) || "";
        const album = (state && state.album) || "";
        titleEl.textContent = title;
        subtitleEl.textContent = [artist, album].filter(Boolean).join(" — ") || "Apple Music";

        const playing = Boolean(state && state.isPlaying);
        playPauseBtn.classList.toggle("is-playing", playing);
        playPauseBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
        playPauseBtn.title = playing ? "Pause" : "Play";

        const url = state && state.artworkUrl;
        if (url) {
          artEl.onload = () => artWrap.classList.add("has-art");
          artEl.onerror = () => {
            artWrap.classList.remove("has-art");
            artEl.removeAttribute("src");
          };
          if (artEl.src !== url) {
            artEl.src = url;
          } else {
            artWrap.classList.add("has-art");
          }
        } else {
          artEl.removeAttribute("src");
          artWrap.classList.remove("has-art");
        }
      }

      document.getElementById("prev").addEventListener("click", () => window.mini.sendCommand("previous"));
      document.getElementById("next").addEventListener("click", () => window.mini.sendCommand("next"));
      document.getElementById("playPause").addEventListener("click", () => window.mini.sendCommand("playPause"));
      document.getElementById("open").addEventListener("click", () => window.mini.openMain());

      window.mini.getState().then(applyState);
      window.mini.onState(applyState);
    </script>
  </body>
</html>
